name: Auto Bet

# Runs daily in the cloud (no local machine needed) and lets Claude Code place
# predictions for the current matchday via the kicktipp MCP server.

on:
  schedule:
    # 06:00 UTC daily (= 08:00 CEST). Adjust as you like; cron is UTC.
    - cron: '0 6 * * *'
  workflow_dispatch: # allows manual runs from the Actions tab for testing

concurrency:
  group: auto-bet
  cancel-in-progress: false

jobs:
  bet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure kicktipp MCP server
        env:
          KICKTIPP_EMAIL: ${{ secrets.KICKTIPP_EMAIL }}
          KICKTIPP_PASSWORD: ${{ secrets.KICKTIPP_PASSWORD }}
          KICKTIPP_COMMUNITY: ${{ secrets.KICKTIPP_COMMUNITY }}
        run: node scripts/setup-mcp.mjs "$RUNNER_TEMP/mcp-config.json"

      - name: Place bets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat .github/auto-bet-prompt.md)" \
            --mcp-config "$RUNNER_TEMP/mcp-config.json" \
            --allowedTools "mcp__kicktipp__get_status,mcp__kicktipp__get_today_matches,mcp__kicktipp__get_bets,mcp__kicktipp__place_bets" \
            --dangerously-skip-permissions \
            --model claude-opus-4-8
